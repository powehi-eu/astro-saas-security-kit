<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Schéma technique simplifié du kit de sécurité Astro SaaS</title>
  <desc id="desc">Architecture en quatre étapes : client, application Astro, sécurité, données et exploitation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/>
    </marker>
    <style>
      .h1{font:700 36px Inter,Segoe UI,sans-serif;fill:#0f172a}.sub{font:400 18px Inter,Segoe UI,sans-serif;fill:#64748b}
      .kicker{font:700 13px Inter,Segoe UI,sans-serif;letter-spacing:1.5px;fill:#64748b}.head{font:700 22px Inter,Segoe UI,sans-serif;fill:#0f172a}
      .name{font:600 16px Inter,Segoe UI,sans-serif;fill:#1e293b}.note{font:400 14px Inter,Segoe UI,sans-serif;fill:#64748b}.flow{font:600 13px Inter,Segoe UI,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1600" height="820" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="10" fill="#7c3aed"/>
  <text x="80" y="86" class="h1">Schéma fonctionnel</text>
  <text x="80" y="122" class="sub">Une requête traverse l’application, les contrôles de sécurité, puis les données.</text>

  <line x1="330" y1="390" x2="410" y2="390" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="390" x2="780" y2="390" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1070" y1="390" x2="1150" y2="390" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="343" y="365" class="flow">HTTPS</text><text x="707" y="365" class="flow">contrôles</text><text x="1077" y="365" class="flow">requête autorisée</text>

  <!-- Client -->
  <g filter="url(#shadow)"><rect x="80" y="250" width="250" height="280" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text x="110" y="290" class="kicker">01 · ENTRÉE</text><text x="110" y="330" class="head">Client web</text>
    <circle cx="205" cy="410" r="48" fill="#e0f2fe"/><path d="M178 430h54M184 390h42v30h-42z" fill="none" stroke="#0284c7" stroke-width="5" stroke-linejoin="round"/>
    <text x="110" y="490" class="name">Utilisateur · navigateur</text><text x="110" y="515" class="note">HTTPS uniquement</text>
  </g>

  <!-- Application -->
  <g filter="url(#shadow)"><rect x="410" y="210" width="290" height="360" rx="18" fill="#fff" stroke="#c4b5fd"/>
    <text x="440" y="250" class="kicker">02 · APPLICATION</text><text x="440" y="290" class="head">Astro côté serveur</text>
    <rect x="440" y="325" width="230" height="75" rx="12" fill="#f5f3ff"/><image href="data:image/svg+xml;base64," x="462" y="340" width="44" height="44"/><text x="525" y="368" class="name">Astro</text>
    <rect x="440" y="415" width="230" height="75" rx="12" fill="#eff6ff"/><image href="data:image/svg+xml;base64," x="462" y="430" width="44" height="44"/><text x="525" y="458" class="name">TypeScript</text>
    <text x="440" y="530" class="note">Middleware · routes · API</text>
  </g>

  <!-- Security -->
  <g filter="url(#shadow)"><rect x="780" y="170" width="290" height="440" rx="18" fill="#fff" stroke="#f0abfc"/>
    <text x="810" y="210" class="kicker">03 · GARDE-FOU</text><text x="810" y="250" class="head">Sécurité</text>
    <rect x="810" y="285" width="230" height="65" rx="12" fill="#fdf4ff"/><image href="data:image/svg+xml;base64," x="830" y="300" width="38" height="38"/><text x="885" y="325" class="name">Better Auth</text>
    <rect x="810" y="365" width="230" height="65" rx="12" fill="#fdf4ff"/><image href="data:image/svg+xml;base64," x="830" y="380" width="38" height="38"/><text x="885" y="405" class="name">Zod · validation</text>
    <rect x="810" y="445" width="230" height="65" rx="12" fill="#fdf4ff"/><image href="data:image/svg+xml;base64," x="830" y="460" width="38" height="38"/><text x="885" y="485" class="name">Upstash · quotas</text>
    <text x="810" y="560" class="note">Session · RBAC · CSRF · rate limit</text>
  </g>

  <!-- Data -->
  <g filter="url(#shadow)"><rect x="1150" y="210" width="290" height="360" rx="18" fill="#fff" stroke="#67e8f9"/>
    <text x="1180" y="250" class="kicker">04 · PERSISTANCE</text><text x="1180" y="290" class="head">Données &amp; suivi</text>
    <rect x="1180" y="325" width="230" height="75" rx="12" fill="#ecfeff"/><image href="data:image/svg+xml;base64," x="1202" y="340" width="44" height="44"/><text x="1265" y="368" class="name">Drizzle ORM</text>
    <rect x="1180" y="415" width="230" height="75" rx="12" fill="#ecfeff"/><image href="data:image/svg+xml;base64," x="1202" y="430" width="44" height="44"/><text x="1265" y="458" class="name">PostgreSQL</text>
    <image href="data:image/svg+xml;base64," x="1180" y="515" width="28" height="28"/><text x="1218" y="536" class="note">Pino · audit</text>
    <image href="data:image/svg+xml;base64," x="1300" y="515" width="28" height="28"/><text x="1338" y="536" class="note">Vitest · tests</text>
  </g>

  <rect x="80" y="680" width="1360" height="60" rx="14" fill="#0f172a"/>
  <text x="110" y="717" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Flux de confiance :</text>
  <text x="280" y="717" font-family="Inter,Segoe UI,sans-serif" font-size="16" fill="#cbd5e1">le serveur valide l'identité, les droits et les entrées avant tout accès aux données.</text>
</svg>


